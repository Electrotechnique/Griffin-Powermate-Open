name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build
        run: make CROSS=
      - name: Test
        run: make test CROSS=
      - uses: actions/upload-artifact@v4
        with:
          name: PowerMate
          path: build/PowerMate.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PowerMate.exe

  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (MSVC)
        run: |
          cmake -B build
          cmake --build build --config Release
