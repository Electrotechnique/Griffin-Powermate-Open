name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, e.g. v1.0.0 (empty = build only)'
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build
        run: make CROSS=
      - name: Test
        run: make test CROSS=
      - uses: actions/upload-artifact@v4
        with:
          name: PowerMate
          path: build/PowerMate.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PowerMate for Windows ${{ inputs.version || github.ref_name }}
          generate_release_notes: true
          files: build/PowerMate.exe

  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (MSVC)
        run: |
          cmake -B build
          cmake --build build --config Release
